<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法律与支持文档 · Legal &amp; Support Hub</title>
<style>
  :root { --ink: #0F1D1B; --accent: #193A38; --muted: #5c6b68; --bg: #FDFDFB; --card: #F4F6F3; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.75; }
  main { max-width: 65ch; margin: 0 auto; padding: 48px 24px 80px; }
  h1 { font-size: 1.6rem; color: var(--accent); margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: .85rem; margin-bottom: 28px; }
  h2 { font-size: 1.15rem; color: var(--accent); margin: 32px 0 10px; }
  ul { padding-left: 20px; }
  li { margin: 8px 0; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid #cdd8d3; }
  a:hover { border-bottom-color: var(--accent); }
  .divider { border: none; border-top: 1px solid #e3e8e4; margin: 40px 0; }
  .app-card { background: var(--card); border-radius: 12px; padding: 20px 24px; }
</style>
</head>
<body>
<main>
  <h1>法律与支持文档</h1>
  <p class="meta">多应用共享的法务托管仓库 · 每个 App 一个目录</p>

  <div class="app-card">
    <h2>框影 Framelet</h2>
    <ul>
      <li><a href="framelet/privacy.html">隐私政策 · Privacy Policy</a></li>
      <li><a href="framelet/terms.html">服务条款 · Terms of Service</a></li>
      <li><a href="framelet/support.html">支持 · Support</a></li>
    </ul>
  </div>

  <hr class="divider">

  <h2>结构说明</h2>
  <ul>
    <li>每个 App 使用独立目录（如 <code>framelet/</code>），目录内放置该 App 的法务页面。</li>
    <li>App 内链接一律直取对应目录 URL，不依赖根目录任何页面文件。</li>
    <li>新 App 上架时，在根目录新增一个同名目录并复制三页模板即可。</li>
  </ul>
</main>
</body>
</html>
